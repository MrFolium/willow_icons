buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    rootProject.ext {
        MinSdk = 21
        TargetSdk = 36
        CompileSdk = 36
        VersionName = '2.1'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}